<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="crestBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#991F2B" />
      <stop offset="65%" stop-color="#6B0F1A" />
      <stop offset="100%" stop-color="#3B050B" />
    </radialGradient>

    <!-- 24K Rich Gold Gradient for Rings & Filigree -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#F3CA68" />
      <stop offset="50%" stop-color="#C9942A" />
      <stop offset="75%" stop-color="#F7D98B" />
      <stop offset="100%" stop-color="#9C6B16" />
    </linearGradient>

    <!-- Ring Metallic Shimmer -->
    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9942A" />
      <stop offset="30%" stop-color="#FFF2C6" />
      <stop offset="55%" stop-color="#DDA93C" />
      <stop offset="85%" stop-color="#FFE79A" />
      <stop offset="100%" stop-color="#8C5C0F" />
    </linearGradient>

    <!-- Ruby Heart Gradient -->
    <linearGradient id="rubyHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C72" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#88081D" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F3CA68" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Crest Base with Shadow -->
  <circle cx="60" cy="60" r="54" fill="url(#crestBg)" filter="url(#softGlow)" />

  <!-- Outer Luxury Gold Beaded Ring -->
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#goldLuxury)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#goldLuxury)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.85" />
  <circle cx="60" cy="60" r="46.5" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" />

  <!-- Crown "25" Silver Jubilee Emblem at Top -->
  <g filter="url(#goldGlow)">
    <!-- Little Crown / Sparkle Accent -->
    <path d="M 60 16 L 61.8 21.2 L 67 23 L 61.8 24.8 L 60 30 L 58.2 24.8 L 53 23 L 58.2 21.2 Z" fill="url(#goldLuxury)" />
    <circle cx="48" cy="24" r="1.2" fill="#FFE8A3" />
    <circle cx="72" cy="24" r="1.2" fill="#FFE8A3" />

    <!-- "25" Typography -->
    <text x="60" y="41" 
          font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
          font-size="15" 
          font-weight="700" 
          letter-spacing="0.5"
          fill="url(#goldLuxury)" 
          text-anchor="middle">25</text>
  </g>

  <!-- Interlocking Wedding Bands (The Marriage Rings) -->
  <g filter="url(#softGlow)">
    <!-- Left Ring (Adhi) -->
    <ellipse cx="50" cy="67" rx="17" ry="16" fill="none" stroke="url(#goldShine)" stroke-width="3.6" />
    
    <!-- Right Ring (Satya) -->
    <ellipse cx="70" cy="67" rx="17" ry="16" fill="none" stroke="url(#goldLuxury)" stroke-width="3.6" />

    <!-- Intertwine Overlay (top arc of left ring to appear woven through right ring) -->
    <path d="M 50 51 A 17 16 0 0 1 67 67" fill="none" stroke="url(#goldShine)" stroke-width="3.6" stroke-linecap="round" />
  </g>

  <!-- Central Ruby Heart linking the two rings -->
  <g filter="url(#goldGlow)">
    <path d="M 60 63 C 60 59.5 54.5 56 52 60 C 49 64.8 60 72 60 72 C 60 72 71 64.8 68 60 C 65.5 56 60 59.5 60 63 Z"
          fill="url(#rubyHeart)" 
          stroke="url(#goldLuxury)" 
          stroke-width="1.2" />
  </g>

  <!-- Bottom Laurel Leaves / Ribbon Arc -->
  <path d="M 32 86 C 45 97 75 97 88 86" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-linecap="round" />
  <!-- Tiny decorative dots on laurel arc -->
  <circle cx="34" cy="85" r="1.5" fill="url(#goldLuxury)" />
  <circle cx="43" cy="91" r="1.3" fill="url(#goldLuxury)" />
  <circle cx="52" cy="94" r="1.4" fill="url(#goldLuxury)" />
  <circle cx="60" cy="95" r="1.8" fill="#FFE8A3" />
  <circle cx="68" cy="94" r="1.4" fill="url(#goldLuxury)" />
  <circle cx="77" cy="91" r="1.3" fill="url(#goldLuxury)" />
  <circle cx="86" cy="85" r="1.5" fill="url(#goldLuxury)" />

  <!-- Monogram Initials B • S -->
  <text x="60" y="104" 
        font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
        font-size="7.5" 
        font-weight="600" 
        letter-spacing="2" 
        fill="url(#goldLuxury)" 
        opacity="0.9"
        text-anchor="middle">ADHI &amp; SATYA</text>
</svg>
