<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Rich Royal Burgundy Background -->
    <radialGradient id="favBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A52230" />
      <stop offset="65%" stop-color="#73101C" />
      <stop offset="100%" stop-color="#3D050C" />
    </radialGradient>

    <!-- Warm 24K Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="35%" stop-color="#F5CE6F" />
      <stop offset="70%" stop-color="#C9942A" />
      <stop offset="100%" stop-color="#8E5F12" />
    </linearGradient>

    <!-- Ruby Heart Gradient -->
    <linearGradient id="favRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C72" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#88081D" />
    </linearGradient>
  </defs>

  <!-- Outer Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#favGold)" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.8" />

  <!-- Crown Star -->
  <path d="M 32 7.5 L 33 10.5 L 36 11.5 L 33 12.5 L 32 15.5 L 31 12.5 L 28 11.5 L 31 10.5 Z" fill="url(#favGold)" />

  <!-- "25" Jubilee Number -->
  <text x="32" y="24" 
        font-family="Georgia, serif" 
        font-size="12" 
        font-weight="bold" 
        fill="url(#favGold)" 
        text-anchor="middle">25</text>

  <!-- Interlocking Wedding Bands -->
  <ellipse cx="26" cy="40" rx="10" ry="9.5" fill="none" stroke="url(#favGold)" stroke-width="2.4" />
  <ellipse cx="38" cy="40" rx="10" ry="9.5" fill="none" stroke="url(#favGold)" stroke-width="2.4" />
  <!-- Weave overlap -->
  <path d="M 26 30.5 A 10 9.5 0 0 1 36 40" fill="none" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Central Ruby Heart -->
  <path d="M 32 37.5 C 32 35 28.5 32.5 26.5 35.5 C 24.5 39 32 44.5 32 44.5 C 32 44.5 39.5 39 37.5 35.5 C 35.5 32.5 32 35 32 37.5 Z"
        fill="url(#favRuby)" 
        stroke="url(#favGold)" 
        stroke-width="1" />

  <!-- Delicate Bottom Filigree Curve -->
  <path d="M 18 51 C 25 57 39 57 46 51" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="32" cy="55.5" r="1.2" fill="#FFEBB0" />
</svg>
